name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate ActionBar HUD
        run: npm run generate:actionbar-hud

      - name: Generate scoreboard
        run: npm run generate:scoreboard

      - name: Build and test
        run: npm run check

      - name: Verify generated files are committed
        run: git diff --exit-code

  package:
    name: Package addon
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run package

      - name: Verify committed addon is current
        run: git diff --exit-code -- BombDefusal.mcaddon

      - name: Upload mcaddon
        uses: actions/upload-artifact@v7
        with:
          path: BombDefusal.mcaddon
          archive: false
          retention-days: 14
